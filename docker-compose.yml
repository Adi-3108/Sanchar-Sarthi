services:

  # PostgreSQL
  db:
    image: pgvector/pgvector:pg16
    container_name: gridlock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-eventflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gridlock_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eventflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Backend (FastAPI + ML models)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridlock_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-eventflow}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gridlock_net

volumes:
  postgres_data:
    driver: local

networks:
  gridlock_net:
    driver: bridge
